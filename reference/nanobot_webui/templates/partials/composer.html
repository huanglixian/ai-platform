<section class="panel composer-panel" id="chat-form">
  <header class="panel-toolbar">
    <div>
      <h2 class="panel-title">发送消息</h2>
    </div>
  </header>

  <form class="composer-form">
    <input type="hidden" name="session_key" value="{{ current_key or '' }}">
    <div class="form-field">
      <textarea
        id="content"
        name="content"
        rows="4"
        placeholder="输入你的问题，在本地工作台中直接和 nanobot 对话"
        required
      ></textarea>
    </div>

    <div class="composer-footer">
      <div class="field-hint field-hint-path" id="composer-hint">Workspace：{{ workspace_path }}</div>
      <button class="btn btn-primary btn-lg" type="submit" id="send-button">发送</button>
    </div>
  </form>
</section>
