<article class="message-card message-{{ message.role }}{% if message.role != 'user' and message.role != 'assistant' %} message-muted{% endif %}">
  <div class="message-head">
    <span class="role-pill role-{{ message.role }}">{{ message.role_label }}</span>
    {% if message.timestamp %}
      <span class="message-time">{{ message.timestamp }}</span>
    {% endif %}
  </div>

  {% if message.tool_summary %}
    <div class="message-tool-summary">{{ message.tool_summary }}</div>
  {% endif %}

  <pre class="message-content">{{ message.content or "(empty)" }}</pre>
</article>
