<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dify2.0 Studio - 设置</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="layout">
    <!-- Main -->
    <div class="main" style="margin-left:0;">
      <header class="header">
        <div class="header-left">
          <a class="header-brand" href="../index.html">
            <div class="header-brand-logo">D2</div>
            <span class="header-brand-name">Dify2.0</span>
          </a>
          <div class="header-divider"></div>
          <div class="header-workspace">
            <span class="header-workspace-dot"></span>
            我的工作区
            <span style="font-size:11px; color:var(--text-tertiary);">▾</span>
          </div>
          <span class="header-plan">免费版</span>
        </div>
        <div class="header-center">
          <nav class="header-nav">
            <a class="header-nav-item" href="explore.html">门户</a>
            <a class="header-nav-item" href="knowledge.html">知识库</a>
            <a class="header-nav-item" href="agents.html">自由体</a>
            <a class="header-nav-item" href="#" onclick="goWorkflow(event)">工作流</a>
            <a class="header-nav-item" href="tools.html">工具中心</a>
            <a class="header-nav-item" href="skills.html">技能中心</a>
          
          </nav>
        </div>
        <div class="header-right">
          <div class="header-search">🔍 搜索 ⌘K</div>
          <div class="header-icon-btn" title="插件" onclick="location.href='plugins.html'">🧩</div>
          <div class="header-avatar" onclick="location.href='settings.html'" title="设置">U</div>
        </div>
      </header>

      <div class="content" style="padding:0;">
        <div class="settings-layout">
          <!-- Settings Sidebar -->
          <div class="settings-sidebar">
            <div class="settings-nav-item active">通用设置</div>
            <div class="settings-nav-item">成员管理</div>
            <div class="settings-nav-item">模型供应商</div>
            <div class="settings-nav-item">账单</div>
            <div class="settings-nav-item">数据源</div>
            <div class="settings-nav-item">API 扩展</div>
            <div class="settings-nav-item">自定义界面</div>
          </div>

          <!-- Settings Content -->
          <div class="settings-content">
            <!-- Workspace Settings -->
            <div class="settings-section">
              <h2 class="settings-section-title">工作区设置</h2>
              <p class="settings-section-desc">管理工作区名称和描述信息。</p>
              <div class="form-group">
                <label class="form-label">工作区名称</label>
                <input class="form-input" type="text" value="我的工作区" placeholder="输入工作区名称">
              </div>
              <div class="form-group">
                <label class="form-label">工作区描述</label>
                <textarea class="form-input" rows="3" placeholder="描述你的工作区..." style="resize:vertical;">一个用于构建AI驱动应用和工作流的协作工作区。</textarea>
              </div>
            </div>

            <!-- Language -->
            <div class="settings-section">
              <h2 class="settings-section-title">语言设置</h2>
              <p class="settings-section-desc">选择界面的显示语言。</p>
              <div class="form-group">
                <label class="form-label">界面语言</label>
                <select class="form-select">
                  <option>English</option>
                  <option selected>中文</option>
                  <option>日本語</option>
                </select>
              </div>
            </div>

            <!-- Theme -->
            <div class="settings-section">
              <h2 class="settings-section-title">主题设置</h2>
              <p class="settings-section-desc">选择界面的外观主题。</p>
              <div class="form-group">
                <label class="form-label">外观</label>
                <select class="form-select">
                  <option>跟随系统</option>
                  <option>浅色</option>
                  <option>深色</option>
                </select>
              </div>
            </div>

            <!-- Danger Zone -->
            <div class="settings-section" style="border:1px solid var(--danger); border-radius:var(--radius); padding:20px;">
              <h2 class="settings-section-title" style="color:var(--danger);">危险操作</h2>
              <p class="settings-section-desc">不可逆操作，请谨慎执行。</p>
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div>
                  <div style="font-size:13px; font-weight:500;">删除工作区</div>
                  <div style="font-size:12px; color:var(--text-tertiary);">永久删除此工作区及其所有数据，此操作不可撤销。</div>
                </div>
                <button class="btn" style="background:var(--danger); color:#fff; border-color:var(--danger);">删除工作区</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script>
    function goWorkflow(e) {
      e.preventDefault();
      // 直接跳转到工作流列表页面
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
